<!DOCTYPE html>
<html>
<head>
<title>Product Page</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-purple-50">
<!-- Header -->
<header class="bg-purple-800 text-white p-4">
<h1 class="text-2xl">Technical Store</h1>
</header>
<!-- Products -->
<div class="p-4">
<h2 class="text-2xl text-center mb-4">Our Products</h2>
<div class="flex flex-wrap justify-center gap-4">
<!-- Product 1 -->
<div class="bg-white p-4 w-60 flex flex-col">
<img src="mac2.webp"
class="w-full h-80 object-contain">
<h3 class="text-xl">Laptop</h3>
<p>Price: ₹1,45,999</p>
<button class="bg-purple-700 hover:bg-purple-900 text-white px-5 py-2 mt-auto
self-start rounded-full transition duration-300">

Buy Now
</button>
</div>
<!-- Product 2 -->
<div class="bg-white p-4 w-60 flex flex-col">
<img src="18promax.webp"
class="w-full h-80 object-contain">
<h3 class="text-xl">Mobile</h3>
<p>Price: ₹1,99,999</p>
<button class="bg-purple-700 hover:bg-purple-900 text-white px-5 py-2 mt-auto
self-start rounded-full transition duration-300">

Buy Now
</button>
</div>
<!-- Product 3 -->
<div class="bg-white p-4 w-60 flex flex-col">
<img src="airjordar.jpg"
class="w-full h-80 object-contain">
<h3 class="text-xl">Shoes</h3>
<p>Price: ₹50,499</p>
<button class="bg-purple-700 hover:bg-purple-900 text-white px-5 py-2 mt-auto
self-start rounded-full transition duration-300">

Buy Now
</button>
</div>
<!-- Product 4 -->
<div class="bg-white p-4 w-60 flex flex-col">
<img src="watches.jpg"
class="w-full h-80 object-contain">
<h3 class="text-xl">Jacob &amp; Co</h3>
<p>Price: ₹30,00,499</p>
<button class="bg-purple-700 hover:bg-purple-900 text-white px-5 py-2 mt-auto
self-start rounded-full transition duration-300">

Buy Now
</button>
</div>
</div>
</div>
<!-- Footer -->
<footer class="bg-purple-950 text-white text-center p-4">
Technical Store © 2026
</footer>
</body>
</html>
